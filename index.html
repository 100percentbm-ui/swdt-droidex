<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Droid Tycoon Droidex</title>
<style>
:root{--bg:#eef2f6;--sf:#fff;--tx:#14202b;--mu:#5d6f7e;--bd:#d3dbe3;--ac:#2b7fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--sf:#131c26;--tx:#e6eef5;--mu:#8eabb8;--bd:#233140;--ac:#53a0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1118;--sf:#131c26;--tx:#e6eef5;--mu:#8eabb8;--bd:#233140;--ac:#53a0ff;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1 small{font-weight:400;color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#q{flex:1;min-width:150px}
.tabs button{padding:5px 11px;border-radius:99px;font-size:13px}
main{padding:16px;max-width:1100px;margin:auto}
h2{font-size:14px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;display:block;width:100%}
.card:hover{border-color:var(--c)}
.card b{display:block;font-size:15px}
.card span{font-size:12px;color:var(--c);font-weight:600}
.card i{display:block;font-style:normal;font-size:12px;color:var(--mu);margin-top:4px;min-height:16px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov.show{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd);border-top:5px solid var(--c);border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:18px}
.modal h3{margin:0;font-size:22px}
.badge{font-size:12px;font-weight:700;color:var(--c)}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.vars button{padding:3px 9px;font-size:12px;border-radius:99px;border-color:var(--vc);color:var(--vc)}
.vars button.on{background:var(--vc);color:#111}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.stat label{color:var(--mu)}
.stat input{width:150px;text-align:right}
.stat span{font-weight:600}
textarea{width:100%;min-height:70px;margin-top:8px;resize:vertical}
.note{margin-top:8px;color:var(--mu);white-space:pre-wrap}
.empty{color:var(--mu);padding:20px 0}
.card em,.badge em{font-style:normal}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.chip{border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font:600 13px ui-monospace,Menlo,Consolas,monospace}
.chip b{color:#19b5cc}
.pl{color:var(--mu)}
</style>
</head>
<body>
<header>
<h1>Droid Tycoon Droidex <small id="cnt"></small></h1>
<div class="row">
<input id="q" type="search" placeholder="Search droids…">
<button id="ed">Edit: off</button>
<button id="ex">Copy data</button>
<button id="rs">Reset</button>
</div>
<div class="row tabs" id="tabs" style="margin-top:8px"></div>
</header>
<main id="main"></main>
<div id="ov"><div class="modal" id="md"></div></div>
<script>
const rarities=['Common','Rare','Epic','Legendary','Mythic'];
const variants=['Default','Gold','Diamond','Rainbow','Beskar','Galactic','Stellar','Kyber','Scourge'];
const droidsByRarity={
Common:['Mouse','Pit','Gonk','CB','R3','R5','R8','Imperial Probe','B1 Battle','DRK-1 Probe','ID10'],
Rare:['BDX Explorer','ARG','Senate Hovercam','BU-4D','Bal-Core','Roll-R','2BB','A-LT','R4','R9','B1 Security','NAV-EX','Vect-Arm','HOV-R','EG-58','SA-5'],
Epic:['Groundmech','L0','AMP Walker','Sen-Tri','Opti-Pod','Gunrunner','BB','R2','R6','Trak-R','Orb-Walker','Util-Tec','B1 Heavy','B2 Super','B2 Heavy','Strike-Orb','Haul-R','LNG-Shot','MPH','EGL','KT','Lom'],
Legendary:['Proto-Roller','Mecha-Droid','Mono-Walker','BB9','R7','B2-RP','Cyclo-Grav','Opti-Strike','J09-4MN','PLNK','PZ'],
Mythic:['Snow Mouse','RIC','RIC-1200','LEP','Loadlifter','DRFT-R','MO-TRAK','TRI-TEK','CYCLENS','KX','IG','ECG','TDA'],
Iconic:['BB-8','MISTER BONES','IG-11','DJ R-3X','CB-23','C-3PO','R2-D2','Chopper','D-O','WG-22','Scourge Prime']};
const fusions={
'WHL-EX':['Rare','Worker','ARG|MOUSE*2'],
'BTL-R':['Rare','Battle','R9|BDX|B1 BATTLE'],
'ZRO-TEC':['Rare','Astro','ID10*2|2BB'],
'N-UL':['Epic','Worker','B1 HEAVY|GUNRUNNER|BB'],
'SCRP-R':['Epic','Astro','GONK|GROUNDMECH|R6'],
'ARM-CORE':['Epic','Battle','ARG*2|B2 HEAVY'],
'OPT-AR':['Epic','Battle','R2*2|B2 SUPER'],
'RO-TOR':['Legendary','Worker','BB9|PIT|B1 BATTLE'],
'FUS-3':['Legendary','Worker','R7|B-U4D*2'],
'ORB-XL':['Legendary','Battle','CB|GUNRUNNER|B2-RP'],
'QIK-BIT':['Legendary','Astro','GROUNDMECH*2|BB9'],
'RIV-3T':['Mythic','Worker','KX|IG|RIC'],
'LUG-G':['Mythic','Worker','LOADLIFTER|ID10|R5'],
'X-ONK':['Mythic','Battle','KX*2|GONK'],
'SRV-0':['Mythic','Battle','RIC-1200|B1 HEAVY*2'],
'AXI-POD':['Mythic','Astro','RIC|BDX|R7'],
'LOW-MO':['Mythic','Astro','A-LT*2|LOADLIFTER']};
Object.entries(fusions).forEach(([n,f])=>droidsByRarity[f[0]].push(n));
const tc={Worker:'#4cc16a',Battle:'#ee5a4f',Astro:'#b565d6'};
const rc={Common:'#8eabb8',Rare:'#53c8e5',Epic:'#a580ff',Legendary:'#ffb85a',Mythic:'#ff6e90',Iconic:'#f6d34d'};
const vc={Default:'#8eabb8',Gold:'#f6c85f',Diamond:'#6de4ff',Rainbow:'#d38cff',Beskar:'#b9c8d2',Galactic:'#ff7197',Stellar:'#f2d34f',Kyber:'#7cf4e8',Scourge:'#ff5b68'};
const groups=[...rarities,'Iconic'];
const fields=[['cost','Cost'],['price','Price'],['cps','Credits / second'],['craft','Craft time'],['sell','Sell price']];
const KEY='droidex-stats-v1';
let stats={},filter='All',query='',edit=false,sel=null,variant='Default';
try{stats=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){stats={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}}
const $=id=>document.getElementById(id);
const sk=(n,v)=>n+'|'+v;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderTabs(){
 $('tabs').innerHTML=['All',...groups,'Fusions'].map(g=>`<button data-g="${g}" class="${filter===g?'on':''}">${g}</button>`).join('');
}
function renderMain(){
 let total=0,html='';
 groups.forEach(g=>{
  if(filter!=='All'&&filter!=='Fusions'&&filter!==g)return;
  const list=droidsByRarity[g].filter(n=>n.toLowerCase().includes(query)&&(filter!=='Fusions'||fusions[n]));
  if(!list.length)return;
  total+=list.length;
  html+=`<h2>${g} · ${list.length}</h2><div class="grid">`+list.map(n=>{
   const s=stats[sk(n,'Default')]||{};
   return `<button class="card" style="--c:${rc[g]}" data-n="${esc(n)}" data-g="${g}"><b>${esc(n)}</b><span>${g}${fusions[n]?` · <em style="color:${tc[fusions[n][1]]}">${fusions[n][1]}</em>`:''}</span><i>${s.cps?esc(s.cps)+' /s':''}</i></button>`}).join('')+'</div>';
 });
 $('main').innerHTML=html||'<div class="empty">No droids match your search.</div>';
 $('cnt').textContent=total+' droids';
}
function renderModal(){
 if(!sel)return;
 const {n,g}=sel,s=stats[sk(n,variant)]||{};
 const fz=fusions[n];let h=`<div class="badge" style="--c:${rc[g]}">${g.toUpperCase()}${fz?` · <em style="color:${tc[fz[1]]}">FUSION · ${fz[1].toUpperCase()}</em>`:''}</div><h3>${esc(n)}</h3>`;
 if(fz)h+='<div class="rec">'+fz[2].split('|').map(p=>{const m=p.match(/^(.*)\*(\d+)$/);return `<span class="chip">${esc(m?m[1]:p)}${m?` <b>×${m[2]}</b>`:''}</span>`}).join('<span class="pl">+</span>')+'</div>';
 h+='<div class="vars">'+variants.map(v=>`<button data-v="${v}" style="--vc:${vc[v]}" class="${v===variant?'on':''}">${v}</button>`).join('')+'</div>';
 h+=fields.map(([k,l])=>edit
  ?`<div class="stat"><label>${l}</label><input data-f="${k}" value="${esc(s[k]||'')}" placeholder="optional"></div>`
  :`<div class="stat"><label>${l}</label><span>${s[k]?esc(s[k]):'—'}</span></div>`).join('');
 h+=edit?`<textarea data-f="notes" placeholder="Notes (optional)">${esc(s.notes||'')}</textarea>`:(s.notes?`<div class="note">${esc(s.notes)}</div>`:'');
 h+=`<div class="row" style="margin-top:14px;justify-content:space-between"><button id="tg">${edit?'Done editing':'Edit stats'}</button><button id="cl">Close</button></div>`;
 $('md').style.setProperty('--c',rc[g]);
 $('md').innerHTML=h;
}
function open(n,g){sel={n,g};variant='Default';renderModal();$('ov').classList.add('show')}
function close(){sel=null;$('ov').classList.remove('show');renderMain()}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.g;renderTabs();renderMain()};
$('q').oninput=e=>{query=e.target.value.trim().toLowerCase();renderMain()};
$('main').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.n,c.dataset.g)};
$('ov').onclick=e=>{if(e.target.id==='ov')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)close()});
$('md').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){variant=b.dataset.v;renderModal()}
 else if(b.id==='cl')close();
 else if(b.id==='tg')toggleEdit();
};
$('md').oninput=e=>{
 const f=e.target.dataset.f;if(!f||!sel)return;
 const k=sk(sel.n,variant);stats[k]=stats[k]||{};stats[k][f]=e.target.value;save();
};
function toggleEdit(){edit=!edit;$('ed').textContent='Edit: '+(edit?'on':'off');$('ed').classList.toggle('on',edit);renderModal()}
$('ed').onclick=toggleEdit;
$('ex').onclick=async()=>{
 const t=JSON.stringify(stats,null,2);
 try{await navigator.clipboard.writeText(t);$('ex').textContent='Copied!'}catch(e){$('ex').textContent='Copy blocked';console.log(t)}
 setTimeout(()=>$('ex').textContent='Copy data',1500);
};
let armed=false;
$('rs').onclick=()=>{
 if(!armed){armed=true;$('rs').textContent='Click again to wipe';setTimeout(()=>{armed=false;$('rs').textContent='Reset'},2500);return}
 stats={};save();armed=false;$('rs').textContent='Reset';renderMain();renderModal();
};
renderTabs();renderMain();
</script>
</body>
</html>
